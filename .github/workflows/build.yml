
name: Build PiketKu APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: flutter create --platforms=android --project-name piketku app

      - name: Extract source
        run: |
          unzip PiketKu_Flutter_Source.zip -d source
          cp source/piketku/pubspec.yaml app/pubspec.yaml
          rm -rf app/lib
          cp -r source/piketku/lib app/lib
          cp source/piketku/android/app/src/main/AndroidManifest.xml app/android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Enable Desugaring
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          if not p.exists():
              p = Path("android/app/build.gradle.kts")

          s = p.read_text()
          kotlin = p.suffix == ".kts"

          if "isCoreLibraryDesugaringEnabled" not in s:
              setting = (
                  "isCoreLibraryDesugaringEnabled = true"
                  if kotlin else
                  "isCoreLibraryDesugaringEnabled true"
              )
              s = s.replace(
                  "compileOptions {",
                  "compileOptions {\n        " + setting,
                  1
              )

          if "desugar_jdk_libs" not in s:
              dep = (
                  'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
                  if kotlin else
                  "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
              )
              if "dependencies {" in s:
                  s = s.replace("dependencies {",
                                "dependencies {\n    " + dep, 1)
              else:
                  s += "\ndependencies {\n    " + dep + "\n}\n"

          p.write_text(s)
          PY

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: PiketKu-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          

